      - Per-protein evidence (Stage 0): concepts/stage0-evidence.md
      - Genome-scale priors (Stage 1): concepts/stage1-priors.md
      - Symbolic enforcement (Stage 2A): concepts/stage2a-enforcement.md
      - Flux-certified locus refinement (Stage 2B): concepts/stage2b-fba.md
      - Agentic completion (Stage 3): concepts/stage3-agent.md
