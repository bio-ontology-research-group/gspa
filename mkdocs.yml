      - Resources and data: tutorials/resources.md
      - Bacterial genome: tutorials/bacteria.md
      - Archaeal genome: tutorials/archaea.md
      - Eukaryotic proteome: tutorials/eukaryote.md
      - Incomplete bin (MAG): tutorials/mag.md
      - Mixed metagenome: tutorials/metagenome.md
      - Virus / phage: tutorials/virus.md
      - Unspecified prokaryote: tutorials/prokaryote.md
      - Neural CPU and GPU: tutorials/neural.md
  - Concepts:
