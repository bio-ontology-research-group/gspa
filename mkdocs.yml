      - Viral genomes: scenarios/virus.md
      - Eukaryotic genomes: scenarios/eukaryote.md
      - Metabolic gaps and dark matter: scenarios/metabolic-gaps-dark-matter.md
      - Flux-certified refinement: scenarios/fba-refiner.md
      - Agentic completion: scenarios/agent.md
      - Many genomes in batch: scenarios/batch-multi-genome.md
      - Cross-genome evidence: scenarios/cross-genome.md
      - DeepGO-PlusPlus base predictor: scenarios/deepgo-plusplus.md
      - Evaluate, compare, report: scenarios/evaluate-compare-report.md
