name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gradle-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Build shadowJar
        run: ./gradlew :gspa-cli:shadowJar

      - name: Verify version metadata
        run: |
          jar=$(ls gspa-cli/build/libs/gspa-*.jar | head -1)
          test -n "$jar"
          out=$(java -jar "$jar" --version)
          echo "$out"
          echo "$out" | grep -q '^gspa '

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/**
          if-no-files-found: ignore
