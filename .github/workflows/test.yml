name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gradle-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Build shadowJar
        run: ./gradlew :gspa-cli:shadowJar

      - name: Verify version metadata
        run: |
          jar=$(ls gspa-cli/build/libs/gspa-*.jar | head -1)
          test -n "$jar"
          out=$(java -jar "$jar" --version)
          echo "$out"
          echo "$out" | grep -q '^gspa '

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: |
            **/build/reports/tests/test/**
            **/build/test-results/test/**
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: gradle-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gspa-cli image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: gspa-cli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — gspa-cli --version
        run: |
          out=$(docker run --rm gspa-cli:ci --version)
          echo "$out"
          echo "$out" | grep -qE '^gspa [0-9]'

      - name: Smoke test — gspa-cli --help mentions visualize subcommand
        run: |
          docker run --rm gspa-cli:ci --help | grep -q '^  visualize'

      - name: Smoke test — gspa-cli visualize --help loads bundled templater
        run: |
          # visualize needs python3 on PATH inside the image — verify both
          # the subcommand and the python runtime are reachable.
          docker run --rm --entrypoint python3 gspa-cli:ci --version
          docker run --rm gspa-cli:ci visualize --help | grep -qi 'workdir\|workspace'
